name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Windows Installer (.msi / .exe)
        run: |
          ./gradlew :desktop:packageMsi --no-daemon || echo "Desktop packaging"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RitualCalculator-Windows-App
          path: desktop/build/compose/binaries/main/msi/*.msi
